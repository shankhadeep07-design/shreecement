<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Certificate</title>
  <style>

    @page {
  size: A4 landscape;
  margin: 0;
}
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica', sans-serif;
      background-size: cover;
    }
    .top-left {
     position: absolute;
     z-index: 1;
     top: 0;
     left: 0;
      background: url("{{topLeftPath}}") no-repeat center center;
      background-size: cover;
             height: 260px;
    width: 230px;
    }
    .bottom-right {
           position: absolute;
     z-index: 1;
     bottom: 0;
     right: 0;
      background: url("{{bottomRightPath}}") no-repeat center center;
      background-size: cover;
               height: 260px;
    width: 230px;
    }
    .best-award {
     z-index: 1;
     top: 5px;
     right: 10px;
     position: absolute;
      background: url("{{bestAwardPath}}") no-repeat center center;
      background-size: cover;
      width: 150px;
      height: 150px;
    }
    .container {
width: 11.69in;
    height: 8.27in;
    text-align: center;
    position: relative;
    margin: auto;
    border: solid 1px #ccc;
    }
    .content{
      position: absolute;
      z-index: 2;
      width: 100%;
      height: 100%;
          margin: 55px 0 0 0;
    }
    h1 {
font-size: 54px;
    color: #004f4a;
    font-style: italic;
    font-family: serif;
    }
    h2 {
      font-size: 36px;
      margin: 20px 0;
    }
    p {
      font-size: 20px;
      color: #444;
    }
    .logo {
      width: 100%;
      text-align: center;
      margin-bottom: 50px;
    }
     .logo img{
      width: 250px;
    }
    .signature {
      text-align: right;
      padding-right: 100px;
    }
    .footer{
width: 100%;
margin-top: 15px;
          position: absolute;
    bottom: 106px;
    }
    .date{
float: left;
    margin: 30px 20px 0 30px;
    }
  </style>
</head>
<body>

 
  <div class="container">
<div class="top-left"></div>
<div class="best-award"></div>
<div class="content">
<div class="logo">
    <img src="{{logoPath}}" class="logo" />
 
</div>

    <h1>Certificate of Completion</h1>
    <p>This is proudly presented to</p>
    <h2>{{name}}</h2>
    <p>for successfully completing</p>
    <h2>{{eventName}}</h2>
    <div class="footer">
      <p class="date"><b>Date:</b> {{date}}</p>
    <div class="signature">
      <p>____________________</p>
      <p>Authorized Signature</p>
    </div>
    </div>
    
</div>
    <div class="bottom-right"></div>
  </div>
</body>
</html>
